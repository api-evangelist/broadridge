specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Broadridge
providerId: broadridge
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Financial Services
  - Wealth Management
  - Asset Management
  - Investor Communications
  - Regulatory Reporting
description: Broadridge sells its post-trade, wealth, asset-management, and investor-communications platforms
  to broker-dealers, RIAs, asset managers, and issuers under bilateral commercial agreements. APIs (Wealth
  Management, Galaxia Fund Data, Investor Communications) ship as part of the underlying platform contract
  rather than as self-service priced products. There is no public per-API price list.
sources:
  - https://www.broadridge.com/
  - https://www.broadridge.com/resource/developer-api-contact
  - https://github.com/wealthapiconnector/Broadridge-Wealth-API-Docs
notes: Broadridge does not publish public per-API or per-call pricing. Access is contracted with the
  customer's existing platform subscription. Reconcile against the master services agreement.
plans:
  - id: broadridge-platform-subscription
    name: Platform Subscription / Enterprise Contract
    type: enterprise
    description: API access bundled with a Broadridge platform subscription (Wealth Operations, Asset
      Management / Galaxia, Investor Communications). Pricing is contracted per agreement and tied to
      assets, accounts, communications volume, or seats.
    entries:
      - label: Platform subscription
        name: platform_subscription
        type: subscription
        metric: month
        limit: 1
        timeFrame: month
        geo: configurable
        unit: 1
        price: contact sales
        userMultiplied: false
      - label: API access
        name: api_access
        type: quota
        metric: request
        limit: -1
        timeFrame: month
        geo: configurable
        unit: 1
        price: included with platform subscription
        userMultiplied: false
      - label: Investor communications volume
        name: communications
        type: metered
        metric: communication
        limit: -1
        timeFrame: usage
        geo: configurable
        unit: 1
        price: see services agreement
        userMultiplied: false
    elements:
      - name: Broadridge Wealth Management API
      - name: Broadridge Fund Data Distribution (Galaxia) API
      - name: Broadridge Investor Communications API
maintainers:
  - FN: Kin Lane
    email: info@apievangelist.com
