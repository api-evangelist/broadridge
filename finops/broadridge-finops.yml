description: 'FOCUS-aligned FinOps for Broadridge: enterprise platform subscriptions across Wealth Operations,
  Asset Management / Galaxia Fund Data, and Investor Communications. Pricing is contracted per platform
  subscription and tied to accounts, AUM, and communications volume; APIs ship with the underlying platform
  rather than being separately metered.'
sources:
  - https://www.broadridge.com/
  - https://github.com/wealthapiconnector/Broadridge-Wealth-API-Docs
notes: Broadridge is not metered per API call; cost is governed by the platform subscription and per-event
  communications volume in the master services agreement.
billingModel:
  pricingCategory: Enterprise Subscription + Volume
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Usage
    - Tax
    - Adjustment
