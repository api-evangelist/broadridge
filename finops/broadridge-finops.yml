meters:
  - name: platform_subscription
    description: Monthly subscription fee for the contracted Broadridge platform module.
    unit: month
    aggregation: sum
    dimensions:
      - product_line
      - tier
  - name: accounts
    description: Number of accounts under management on the Wealth Operations / clearing platform.
    unit: account
    aggregation: max
    dimensions:
      - product_line
      - region
  - name: aum
    description: Assets Under Management used as a billing dimension for asset-management modules.
    unit: currency
    aggregation: max
    dimensions:
      - product_line
      - currency
  - name: investor_communications
    description: Investor communications (proxy, regulatory, statements) processed.
    unit: communication
    aggregation: sum
    dimensions:
      - communication_type
      - channel
  - name: fund_data_records
    description: Galaxia fund-data records distributed for regulatory reporting.
    unit: record
    aggregation: sum
    dimensions:
      - regulation
      - fund
principles:
  - name: Visibility
    description: Pull invoice and platform usage reports from Broadridge account management; reconcile
      account counts, AUM, and communications volume against the contracted ceilings on a monthly cadence.
  - name: Allocation
    description: Allocate platform fees by product line, channel, and regulatory regime so wealth, asset-management,
      and communications spend route to the correct internal cost centers.
  - name: Optimization
    description: Consolidate communications channels (digital vs paper), align fund-data feed cadence
      with downstream requirements, and renegotiate volume tiers at renewal as account / AUM growth materializes.
  - name: Accountability
    description: Designate a Broadridge relationship owner per platform module; review monthly invoices,
      dispute discrepancies, and forecast renewals against business growth targets.
