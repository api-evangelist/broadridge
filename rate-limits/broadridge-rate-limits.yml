specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Broadridge
providerId: broadridge
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Financial Services
  - Wealth Management
  - Asset Management
  - Investor Communications
  - Rate Limiting
description: Broadridge does not publish API rate limits on a public developer portal. The Wealth Management,
  Galaxia Fund Data, and Investor Communications APIs are accessed by contracted customers; rate-limit
  terms are conveyed in the platform contract and onboarding documents. Consumers should expect HTTP
  429 throttling on overuse and apply exponential backoff.
sources:
  - https://www.broadridge.com/
  - https://github.com/wealthapiconnector/Broadridge-Wealth-API-Docs
notes: Per-API rate limits are not publicly published; values are contract / onboarding specific.
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - name: Wealth Management API
    scope: contract
    metric: varies
    limit: 'see contract / onboarding documentation'
  - name: Galaxia Fund Data API
    scope: contract
    metric: varies
    limit: 'see contract / onboarding documentation'
  - name: Investor Communications API
    scope: contract
    metric: varies
    limit: 'see contract / onboarding documentation'
policies:
  - name: Backoff Strategy
    description: Apply exponential backoff with jitter on 429 / 503 responses; honor Retry-After when
      present.
  - name: Contract-Bound Capacity
    description: Effective request capacity is set by the platform contract and partner onboarding documents,
      not via a public tier page.
  - name: Batch-Oriented Processing
    description: Many Broadridge data feeds (positions, transactions, fund data) are intentionally batch-oriented;
      align integration design with the documented file / API cadence rather than driving high-frequency
      polling.
  - name: Fair Use
    description: Sustained traffic that materially impacts shared infrastructure may trigger throttling
      regardless of contract.
maintainers:
  - FN: Kin Lane
    email: info@apievangelist.com
